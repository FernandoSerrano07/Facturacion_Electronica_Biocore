# Migraciones BIOCORE. Dos líneas de migración independientes:
#
#   [platform]  schema global `platform` (tenants, usuarios, sesiones, auditoría)
#               alembic --name platform upgrade head
#
#   [tenant]    tablas de cada empresa, aplicadas schema por schema
#               alembic --name tenant -x schema=tenant_<uuid-hex> upgrade head
#
# En el día a día usa `python -m app.cli migrar`, que aplica platform y luego
# todos los schemas de empresa registrados.

[platform]
script_location = %(here)s/migrations/platform
prepend_sys_path = .
path_separator = os

[tenant]
script_location = %(here)s/migrations/tenant
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
