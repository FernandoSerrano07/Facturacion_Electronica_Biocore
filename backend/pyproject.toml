[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"migrations/*/versions/*.py" = ["E501"]
"app/core/permissions.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: pruebas que requieren PostgreSQL (TEST_DATABASE_URL)"]
