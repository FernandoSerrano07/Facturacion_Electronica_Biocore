name: Pruebas

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: biocore
          POSTGRES_PASSWORD: biocore_ci
          POSTGRES_DB: biocore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biocore -d biocore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://biocore:biocore_ci@localhost:5432/biocore_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check .
      - name: Pruebas (incluye PostgreSQL y alembic check)
        run: python -m pytest -q
